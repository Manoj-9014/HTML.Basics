<!DOCTYPE html> 
 
 
<html lang="en" > 
 
 
<head> 
 
 
<meta charset="UTF-8"> 
 
 
<title>Weather Application</title> 
 <body>
 
<linkrel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css"> 
 
<link rel="stylesheet" href="css/style.css"> 
 </body>
 
</head> 
</html>

 
 <style>
body {
    background-image: url(hey.jpg);
    background-size: cover;
}

.container {
    width: 500px;
    height: 300px;
    margin: 25vh auto;
    border-radius: 25px;
    box-shadow: 0 20px 40px 0px rgba(0, 0, 0, 0.3); /* Corrected rgba value */
}

.header {
    height: 20%;
    background-color: #FF9800;
    border-top-left-radius: 25px;
    border-top-right-radius: 25px;
    text-align: center;
    position: relative;
}

#temp, #humidity-div {
    font-family: "Courier New";
    font-weight: bold;
    font-size: 50px;
    color: #fff;
    position: absolute;
    left: 50%;
    top: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
}

.city-icon-holder {
    position: absolute;
    left: 50%; 
    top: 40%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    text-align: center;
}

#city-name {
    font-family: "Courier New";
    font-size: 30px;
    font-weight: bold;
    color: #fff;
}

#icon {
    width: 50%;
}

#main {
    width: 100%;
    display: flex; 

.city-icon {
    height: 80%;
    width: 50%;
    border-bottom-left-radius: 25px;
    background-color: #FFC107;
}

.temperature {
    height: 40%;
    width: 50%;
    background-color: #9C27B0;
    position: relative;
}

.humidity {
    height: 40%;
    width: 50%;
    border-bottom-right-radius: 25px;
    background-color: #E91E63;
    position: relative; 
}

#search-btn {
    width: 40px;
    height: 40px;
    color: #eee;
    background-color: transparent; /
    border: none; 
    cursor: pointer; 
}

#search-txt {
    height: 30px;
    border-radius: 10px;
    border: none; 
    outline: none;
    padding: 0 10px; =
    text-align: center;
}

.search {
    position: absolute;
    left: 50%;
    top: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
}

.tuban {
    color: white;
    padding-left: 40px;
    padding-bottom: 10px;
}

</style>
<body>
    <div class="container">
        <header class="header">
            <div class="search">
                <input type="text" placeholder="Enter City Name" id="search-txt">
                <button id="search-btn"><i class="fas fa-search"></i></button>  </button> </div>
        </header>
        <main id="main">
            <div class="city-icon">
                <div class="city-icon-holder">
                    <div id="city-name"></div>
                    <img src="" alt="" id="icon">
                </div>
            </div>
            <div class="temperature">
                <h5 class="tuban">Temperature(C)</h5>
                <div id="temp"></div>  </div> <div class="humidity">
                <h5 class="tuban">Humidity(%)</h5>
                <div id="humidity-div"></div>
            </div>
        </main>
    </div>

    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script> <script>
    
    </script>
</body>
</html>
